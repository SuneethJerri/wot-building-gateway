; room1-fan  ->  CoAP server on the chip  (Level 3 distributed device firmware).
; Embedded twin of devices/coap_relay.py, fulfils tds/fan-coap.json:
;   GET  /status -> {"on": bool}   (application/json)
;   PUT  /on  /off                 -> switch the relay, 2.04 Changed
; Assigned to ESP8266 #1 (B4:E6:2D:6A:B7:44). Advertises mDNS room1-fan.local.
;
;   cp include/secrets.h.example include/secrets.h   # WiFi only (no broker)
;   pio run -t upload && pio device monitor

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp8266_exception_decoder, time
lib_deps =
    hirotakaster/CoAP simple library @ ^1.4.0
