; ESP8266 / ESP32 health checker for the WoT building gateway (Level 3 bring-up).
; Flash this to each board as you connect it to confirm the chip, flash, radio
; and power are healthy BEFORE assigning it a device role (sensor/fan-coap/fan-mqtt).
;
; Pick the env for the connected chip:
;   pio run -e nodemcuv2 -t upload     # ESP8266 NodeMCU Amica (ESP-12E), /dev/ttyUSB*
;   pio run -e esp32dev  -t upload     # ESP32-D0WD dev board,          /dev/ttyACM* or ttyUSB*
; then: pio device monitor
;
; esptool-detected so far: ESP8266EX (4MB) and ESP32-D0WD-V3 (dual core).

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp8266_exception_decoder, time

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
