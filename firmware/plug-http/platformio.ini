; room1-plug  ->  HTTP server on the chip  (Level 3 distributed device firmware).
; Embedded twin of devices/http_plug.py, fulfils tds/plug.json:
;   GET  /status -> {"on": bool, "power": W}
;   POST /on  /off -> switch the relay, returns the new status
; Assigned to ESP8266 #2 (CC:50:E3:56:7F:8E). Advertises mDNS room1-plug.local.
;
;   cp include/secrets.h.example include/secrets.h   # WiFi only (no broker)
;   pio run -t upload && pio device monitor

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp8266_exception_decoder, time
; ESP8266WebServer + ESP8266mDNS are built into the platform - no lib_deps needed.
