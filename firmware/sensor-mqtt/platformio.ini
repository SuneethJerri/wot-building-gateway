; DHT temp/humidity sensor -> MQTT  (Level 3 distributed device firmware).
; WoT device: room1-sensor  (mirrors devices/sensor.py + tds/sensor.json).
;
; Assigned to the ESP32 (heaviest continuous workload: timing-critical DHT reads
; + steady publishing). Dual-arch so it can also run on an ESP8266 if reassigned.
;
;   cp include/secrets.h.example include/secrets.h   # then fill in WiFi + broker
;   pio run -e esp32dev -t upload && pio device monitor
;
; Topics (base building/room1):  /temp  /humidity (retained)  /overheat (event)

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:esp32dev]
platform = espressif32
board = esp32dev
monitor_filters = esp32_exception_decoder, time

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
upload_speed = 460800
monitor_filters = esp8266_exception_decoder, time
